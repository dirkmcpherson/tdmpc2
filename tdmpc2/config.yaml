defaults:
    - override hydra/launcher: submitit_local

# environment
task: dog-run
obs: state
episodic: True

# evaluation
checkpoint: ???
eval_episodes: 10
eval_freq: 50000

# training
steps: 300_000
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
termination_coef: 1
consistency_coef: 20
rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 1_000_000
exp_name: default
data_dir: ???

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2
temperature: 0.5

# actor
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# critic
num_bins: 101
vmin: -10
vmax: +10

# architecture
model_size: ???
num_enc_layers: 2
enc_dim: 256
encoder: conv
freeze_encoder: true
num_channels: 32
mlp_dim: 512
latent_dim: 512
task_dim: 96
num_q: 5
dropout: 0.01
simnorm_dim: 8
uncertainty_weight: false
num_dynamics: 3
second_cam: none

# unreliable region experiment
unreliable_region: false     # enable broken env (randomize actions in bad region)
oracle_avoidance: false      # enable oracle reliability fn in MPPI planning
unreliable_axis: 1           # 0=x, 1=y, 2=z of EE position
unreliable_threshold: 0.0    # boundary on that axis
unreliable_side: positive    # "positive" = EE > threshold is bad
reliability_mode: mask       # "mask" = hard avoidance, "cost" = soft penalty
reliability_cost: 10.0       # weight for "cost" mode
ee_obs_idx: 18               # index of tcp xyz in state obs (18 for state, 19 for rgb+state)
ee_action_scale: 1.0         # scale factor for action-to-EE-delta mapping

# logging
wandb_project: ???
wandb_entity: None
wandb_silent: false
enable_wandb: true
save_csv: true

# misc
compile: true
save_video: true
save_agent: true
seed: 1
demo_dir: null

# convenience
work_dir: ???
task_title: ???
multitask: ???
tasks: ???
obs_shape: ???
action_dim: ???
episode_length: ???
obs_shapes: ???
action_dims: ???
episode_lengths: ???
seed_steps: ???
bin_size: ???
